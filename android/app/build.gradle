plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.manchapp.beta'
    compileSdk 35

    defaultConfig {
        applicationId 'pe.manchapp.beta'
        minSdk 24
        targetSdk 28
        versionCode 16
        versionName '0.8.0'
    }

    sourceSets { main { assets.srcDirs += ['src/sellerAssets'] } }

    // Each device receives only its native library; the model stays local in every seller APK.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = '1024m'; systemProperty 'manchapp.root', rootProject.projectDir.absolutePath; systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def demoKey = rootProject.file('.tools/android/demo-key.p12')
    if (demoKey.exists()) {
        signingConfigs {
            demo {
                storeFile demoKey
                storePassword 'android'
                keyAlias 'manchapp'
                keyPassword 'android'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.demo
            }
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
